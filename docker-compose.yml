services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    command: >
      sh -c "python src/main.py migrate --noinput &&
             python src/main.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1"
    volumes:
      - staticfiles:/app/staticfiles
    networks: [appnet]

  nginx:
    image: nginx:1.27
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/vol/static:ro
    depends_on: [web]
    restart: unless-stopped
    networks: [appnet]

volumes:
  staticfiles:

networks:
  appnet:
